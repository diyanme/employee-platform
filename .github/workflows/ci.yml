name: Employee Platform CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Laravel Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            -t employee-platform:test \
            .

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/employee-platform
          TAG=${{ github.sha }}

          docker build \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            .

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: publish

    steps:
      - name: Deploy latest image
        run: |
          cd /opt/employee-platform

          docker compose -f compose.yml pull app

          docker compose -f compose.yml build nginx

          docker compose -f compose.yml up -d

          sleep 5

          docker compose -f compose.yml exec -T app php artisan migrate --force

          curl -fsS http://127.0.0.1:8000/employees > /dev/null
